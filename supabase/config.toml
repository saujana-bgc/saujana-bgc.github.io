
[functions.attendance-update]
enabled = false
verify_jwt = true
import_map = "./functions/attendance-update/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/attendance-update/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/attendance-update/*.html" ]

[functions.attendance-webhook]
enabled = false
verify_jwt = false
entrypoint = "./functions/attendance-webhook/index.ts"

[functions.public-gatherings]
enabled = true
verify_jwt = false
entrypoint = "./functions/public-gatherings/index.ts"

[functions.riichi-open-public]
enabled = true
verify_jwt = false
entrypoint = "./functions/riichi-open-public/index.ts"

[functions.riichi-open-admin]
enabled = true
verify_jwt = true
entrypoint = "./functions/riichi-open-admin/index.ts"
