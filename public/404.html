<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#354c3e">
  <title>Page not found | Saujana BGC</title>
  <style>
    :root { color-scheme: light; --paper: #f7f5ef; --surface: #fffefa; --green: #354c3e; --ink: #393d35; --muted: #6a6d64; --line: #dedbd1; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: var(--paper); color: var(--ink); font: 1rem/1.6 system-ui, sans-serif; }
    main { width: min(100%, 720px); overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); text-align: center; }
    .illustration { display: block; width: 100%; height: auto; }
    .content { padding: clamp(24px, 6vw, 42px); }
    a { color: var(--green); text-underline-offset: .2em; }
    .brand { margin: 0 0 22px; color: var(--green); font: 1.3rem Georgia, serif; }
    h1 { margin: 0; color: var(--green); font: 400 clamp(2.3rem, 8vw, 3.6rem)/1.1 Georgia, serif; }
    p { color: var(--muted); }
    nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px 22px; margin-top: 24px; }
    nav a { display: inline-flex; min-height: 44px; align-items: center; font-weight: 650; }
    :focus-visible { outline: 3px solid #8a6a3e; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img class="illustration" src="/images/site/404-missing-path.webp" alt="A woman in an olive cardigan searches a board game map for the missing path." width="1536" height="1024">
    <section class="content">
      <p class="brand">Saujana Board Game Community</p>
      <h1>We couldn’t find that page.</h1>
      <p>Try the gatherings calendar or head back to the home page.</p>
      <nav aria-label="Page recovery">
        <a href="/">Home</a>
        <a href="/gatherings/">Find a gathering</a>
      </nav>
    </section>
  </main>
</body>
</html>
