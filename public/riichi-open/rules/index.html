  <link rel="canonical" href="https://saujana-bgc.org/riichi-rules/">
  <title>Riichi Rules | Saujana BGC</title>
  <script>
    const legacySectionIds = {
      '6-basic-settings': '1-basic-settings',
      '7-calls-and-draws': '2-calls-and-draws',
      '8-head-bump': '3-head-bump',
      '9-dealer-and-match-progression': '4-dealer-and-match-progression',

      '15-minor-mistakes': '10-minor-mistakes',
      '16-player-conduct': '11-player-conduct',
      '17-tournament-administration': '12-tournament-administration',

    const destination = new URL('/riichi-rules/', window.location.origin)

    const legacyId = decodeURIComponent(window.location.hash.slice(1))
    destination.hash = legacySectionIds[legacyId] || legacyId
    window.location.replace(destination.href)
